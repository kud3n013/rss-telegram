# All feeds live here. /add and /remove in Telegram edit this file (comments are kept).
#
# Per-feed options (only `url` is required):
#   name      label shown in Telegram and on the mirror pages
#   mode      auto  (default) use the feed's own content if it is long enough, else fetch the page
#             feed  never fetch the page: convert the feed's HTML (short posts, release notes)
#             fetch always fetch the page and extract the article
#   client    plain (default) or impersonate (curl_cffi Chrome TLS fingerprint, for Cloudflare sites)
#   selector  CSS selector to extract instead of the generic extractor (fetch mode)
#   remove    CSS selectors of page elements to delete before extracting (widgets, embeds)
#   subtitle_selector  CSS selector of the page's subtitle/standfirst: shown as the subtitle
#   filter    {title_contains: [..]}: only items whose title has one of these words are mirrored
#   min_chars minimum feed-content length for `auto` to skip the page fetch (default 600)
#
# URLs are the key of the per-feed state in seen.json: don't edit one unless you want it re-bootstrapped.
feeds:
  - url: https://retractionwatch.com/feed/
    name: Retraction Watch
  - url: https://world.hey.com/dhh/feed.atom
    name: DHH
  - url: https://github.com/zen-browser/desktop/releases.atom
    name: Zen Browser releases
    mode: feed
  - url: https://github.com/imputnet/helium/releases.atom
    name: Helium browser releases
    mode: feed
  - url: https://annas-archive.gl/blog/rss.xml
    name: Anna's Archive blog
  - url: https://blog.beeper.com/feed/
    name: Beeper Blog
    mode: feed
  - url: https://proton.me/blog/feed
    name: Proton Blog
  - url: https://obsidian.md/feed.xml
    name: Obsidian Blog
  - url: https://mastodon.social/@Z_Lib_official.rss
    name: Z-Library Official
    mode: feed
    min_chars: 0
  - url: https://reason.com/feed/
    name: Reason Magazine
    mode: feed
  - url: https://allenai.org/rss.xml
    name: Ai2 Blog
    mode: fetch
  # hltv.org is behind Cloudflare: impersonate Chrome; if still blocked the run carries on without it.
  # The generic extractor also picks up HLTV's hidden player/team hover cards, so take only the
  # article body and drop the match widgets (scoreboard, stats tables, embeds).
  - url: https://www.hltv.org/rss/news
    name: HLTV News
    mode: fetch
    client: impersonate
    selector: "article.newsitem .newstext-con"
    subtitle_selector: "article.newsitem p.headertext"
    remove: [".image-con", ".videoCon", ".newsitem-match-result", ".newsitem-match-stats", ".event-matches-table"]
  - url: https://www.thatprivacyguy.com/blog/feed.xml
    name: That Privacy Guy! Blog
    mode: fetch
  - url: https://www.zotero.org/blog/feed/
    name: Zotero
    mode: feed
  - url: https://steamcommunity.com/groups/freegamesfinders/rss
    name: Weekly Free Games
    mode: feed
    min_chars: 0
    # filter: {title_contains: [Epic]}   # uncomment to mirror only the Epic freebies
