name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.0"
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_notify tests.test_mirror tests.test_site -v
