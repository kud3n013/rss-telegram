name: RSS to Telegram

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 minutes, GitHub's minimum (runs are often delayed by a few minutes)
  workflow_dispatch:          # lets you run it manually from the Actions tab
    inputs:
      backfill:
        description: "Send the latest N posts from every feed once (0 = off)"
        required: false
        default: "0"
        type: string

permissions:
  contents: write             # needed to commit seen.json and feeds.txt back to the repo

concurrency:
  group: rss-telegram
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch feeds and send new items
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKFILL: ${{ inputs.backfill }}   # empty on scheduled runs
          NEW_FEED_BACKFILL: ${{ vars.NEW_FEED_BACKFILL || '0' }}
          EXCERPT_CHARS: ${{ vars.EXCERPT_CHARS || '800' }}
          LINK_PREVIEW: ${{ vars.LINK_PREVIEW || '0' }}
        run: python notify.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json feeds.txt   # feeds.txt changes when you use /add or /remove
          git diff --staged --quiet || {
            git commit -m "Update state"
            git pull --rebase
            git push
          }
