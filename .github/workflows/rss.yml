name: RSS to Telegram

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch:          # lets you run it manually from the Actions tab
    inputs:
      backfill:
        description: "Send the latest N posts from every feed once (0 = off)"
        required: false
        default: "0"
        type: string

permissions:
  contents: write             # needed to commit seen.json back to the repo

concurrency:
  group: rss-telegram
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch feeds and send new items
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKFILL: ${{ inputs.backfill }}   # empty on scheduled runs
          NEW_FEED_BACKFILL: ${{ vars.NEW_FEED_BACKFILL || '0' }}
        run: python notify.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "Update seen items" && git push)
